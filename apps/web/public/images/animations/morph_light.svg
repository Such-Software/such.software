  <style>
    .d { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: sg-dot-in 420ms ease-in-out forwards, sg-dot-out 420ms ease-in-out forwards; }
    @keyframes sg-dot-in { to { transform: scale(1); } }
    @keyframes sg-dot-out { from { transform: scale(1); opacity: 1; } to { transform: scale(0.55); opacity: 0; } }
    .sym { transform-box: fill-box; transform-origin: center; opacity: 0; transform: scale(0.62); animation: sg-sym-in 420ms ease-in-out forwards, sg-sym-out 900ms ease-in-out forwards; }
    @keyframes sg-sym-in { to { opacity: 1; transform: scale(1); } }
    @keyframes sg-sym-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.55); } }
    .g { stroke-dasharray: 400; stroke-dashoffset: 400; animation: sg-draw 1600ms ease-in-out forwards; }
    @keyframes sg-draw { to { stroke-dashoffset: 0; } }
    .frame { opacity: 0; animation: sg-fade 900ms ease-out forwards; }
    @keyframes sg-fade { to { opacity: var(--frame-opacity, 0.45); } }
    .d-s { animation-delay: 0ms, 540ms; }
    .sym-s { animation-delay: 540ms, 1640ms; }
    .g-s { animation-delay: 1640ms; }
    .d-u { animation-delay: 180ms, 720ms; }
    .sym-u { animation-delay: 720ms, 1820ms; }
    .g-u { animation-delay: 1820ms; }
    .d-c { animation-delay: 360ms, 900ms; }
    .sym-c { animation-delay: 900ms, 2000ms; }
    .g-c { animation-delay: 2000ms; }
    .d-h { animation-delay: 540ms, 1080ms; }
    .sym-h { animation-delay: 1080ms, 2180ms; }
    .g-h { animation-delay: 2180ms; }
    .frame { animation-delay: 1640ms; }
    @media (prefers-reduced-motion: reduce) {
      .d, .sym { display: none; }
      .g { animation: none; stroke-dashoffset: 0; }
      .frame { animation: none; opacity: 0.45; }
    }
  </style>
