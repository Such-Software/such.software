    <text class="rn rn1" x="25" y="0">{ }</text>
    <text class="rn rn2" x="42" y="0">S</text>
    <text class="rn rn3" x="58" y="0">10</text>
    <text class="rn rn4" x="74" y="0">U</text>
    <text class="rn rn5" x="90" y="0">0x</text>
    <text class="rn rn6" x="106" y="0">C</text>
    <text class="rn rn7" x="122" y="0">fn</text>
    <text class="rn rn8" x="138" y="0">H</text>
    <text class="rn rn9" x="154" y="0">;</text>
    <text class="rn rn10" x="170" y="0">=&gt;</text>
    <text class="rn rn11" x="185" y="0">[]</text>
  </g>
