<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs><filter id="sg-mglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="sg-clip"><rect width="200" height="200" rx="26"/></clipPath><radialGradient id="sg-shock-s"><stop offset="0" stop-color="#1a5c38" stop-opacity="0.6"/><stop offset="1" stop-color="#1a5c38" stop-opacity="0"/></radialGradient><radialGradient id="sg-shock-u"><stop offset="0" stop-color="#b83670" stop-opacity="0.6"/><stop offset="1" stop-color="#b83670" stop-opacity="0"/></radialGradient><radialGradient id="sg-shock-c"><stop offset="0" stop-color="#176a92" stop-opacity="0.6"/><stop offset="1" stop-color="#176a92" stop-opacity="0"/></radialGradient><radialGradient id="sg-shock-h"><stop offset="0" stop-color="#12857e" stop-opacity="0.6"/><stop offset="1" stop-color="#12857e" stop-opacity="0"/></radialGradient></defs>
  <style>
    .rn { animation: sg-rain linear infinite; }
    @keyframes sg-rain { from { transform: translateY(-100px); } to { transform: translateY(320px); } }
    .rn0 { animation-duration: 2.1s; animation-delay: 0.73s; }
    .rn1 { animation-duration: 1.8s; animation-delay: 0.175s; }
    .rn2 { animation-duration: 2.5s; animation-delay: 1.75s; }
    .rn3 { animation-duration: 1.6s; animation-delay: 0.054s; }
    .rn4 { animation-duration: 2.8s; animation-delay: 1.06s; }
    .rn5 { animation-duration: 2.0s; animation-delay: 1.67s; }
    .rn6 { animation-duration: 1.7s; animation-delay: 0.778s; }
    .rn7 { animation-duration: 2.3s; animation-delay: 1.69s; }
    .rn8 { animation-duration: 1.9s; animation-delay: 0.094s; }
    .rn9 { animation-duration: 2.6s; animation-delay: 2.3s; }
    .rn10 { animation-duration: 2.2s; animation-delay: 0.91s; }
    .rn11 { animation-duration: 1.5s; animation-delay: 0.155s; }
    .zap { animation: sg-zap 1.5s linear infinite; }
    @keyframes sg-zap { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -603.9; } }
    .ctr { animation: sg-zap 1.5s linear infinite; animation-delay: -0.5s; }
    .crk { animation: sg-zap 2.3s linear infinite, sg-flick 0.7s linear infinite; }
    @keyframes sg-flick { 0%,100% { opacity: 0.3; } 20% { opacity: 0.6; } 40% { opacity: 0.1; } 60% { opacity: 0.5; } 80% { opacity: 0.2; } }
    .shock { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: sg-shock 6.0s linear infinite; }
    @keyframes sg-shock { 0%, 14% { transform: scale(0); opacity: 0; } 15% { transform: scale(0); opacity: 0.5; } 25% { transform: scale(1); opacity: 0; } 100% { transform: scale(0); opacity: 0; } }
    .slam { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: sg-slam 6.0s linear infinite; }
    @keyframes sg-slam { 0%, 2% { transform: scale(0); } 5% { transform: scale(1.15); } 8% { transform: scale(1); } 85% { transform: scale(1); } 95% { transform: scale(1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
    .orb { transform-box: fill-box; transform-origin: center; animation: sg-orb 1.5s ease-in-out infinite; }
    @keyframes sg-orb { 0%,100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(2); opacity: 1; } }
    .bdr { animation: sg-hue 4s linear infinite, sg-breathe-o 2s ease-in-out infinite; }
    @keyframes sg-hue { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
    @keyframes sg-breathe-o { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    .slam-s { animation-delay: 0s; }
    .shock-s { animation-delay: 0s; }
    .slam-u { animation-delay: 0.9s; }
    .shock-u { animation-delay: 0.9s; }
    .slam-c { animation-delay: 1.8s; }
    .shock-c { animation-delay: 1.8s; }
    .slam-h { animation-delay: 2.7s; }
    .shock-h { animation-delay: 2.7s; }
    @media (prefers-reduced-motion: reduce) {
      .rn, .zap, .ctr, .crk, .shock { display: none; }
      .slam { animation: none; transform: scale(1); }
      .orb { animation: none; }
      .bdr { animation: none; }
    }
  </style>
  <rect width="200" height="200" rx="26" fill="#f7f8fa"/>
  <g clip-path="url(#sg-clip)" opacity="0.12" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#1a5c38">
