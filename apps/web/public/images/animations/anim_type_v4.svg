<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs><filter id="sg-tglow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="sg-scan" patternUnits="userSpaceOnUse" width="200" height="4"><rect width="200" height="1.5" fill="#ffffff" opacity="0.015"/></pattern></defs>
  <style>
    .ch0 { opacity: 0; animation: sg-ch0 6s linear infinite; }
    @keyframes sg-ch0 { 0%, 5% { opacity: 0; } 6%, 35% { opacity: 0.85; } 38%, 100% { opacity: 0; } }
    .ch1 { opacity: 0; animation: sg-ch1 6s linear infinite; }
    @keyframes sg-ch1 { 0%, 8% { opacity: 0; } 9%, 35% { opacity: 0.85; } 38%, 100% { opacity: 0; } }
    .ch2 { opacity: 0; animation: sg-ch2 6s linear infinite; }
    @keyframes sg-ch2 { 0%, 13% { opacity: 0; } 14%, 35% { opacity: 0.85; } 38%, 100% { opacity: 0; } }
    .ch3 { opacity: 0; animation: sg-ch3 6s linear infinite; }
    @keyframes sg-ch3 { 0%, 18% { opacity: 0; } 19%, 35% { opacity: 0.85; } 38%, 100% { opacity: 0; } }
    .ch4 { opacity: 0; animation: sg-ch4 6s linear infinite; }
    @keyframes sg-ch4 { 0%, 23% { opacity: 0; } 24%, 35% { opacity: 0.85; } 38%, 100% { opacity: 0; } }
    .caret { animation: sg-caret-x 6s linear infinite, sg-blink 6s linear infinite; }
    @keyframes sg-caret-x { 0%, 7% { transform: translateX(0); } 8%, 12% { transform: translateX(16px); } 13%, 17% { transform: translateX(32px); } 18%, 22% { transform: translateX(48px); } 23%, 100% { transform: translateX(64px); } }
    @keyframes sg-blink { 0%, 5% { opacity: 0; } 6%, 9% { opacity: 0.8; } 10%, 13% { opacity: 0; } 14%, 17% { opacity: 0.8; } 18%, 21% { opacity: 0; } 22%, 35% { opacity: 0.8; } 38%, 100% { opacity: 0; } }
    .mat { opacity: 0; animation: sg-mat 6s linear infinite; }
    @keyframes sg-mat { 0%, 38% { opacity: 0; } 45%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
    .flash { opacity: 0; animation: sg-flash 6s linear infinite; }
    @keyframes sg-flash { 0%, 37% { opacity: 0; } 39% { opacity: 0.08; } 44%, 100% { opacity: 0; } }
    .mat-s { animation-delay: 0s; }
    .mat-u { animation-delay: 0.24s; }
    .mat-c { animation-delay: 0.48s; }
    .mat-h { animation-delay: 0.72s; }
    @media (prefers-reduced-motion: reduce) {
      .ch0,.ch1,.ch2,.ch3,.ch4,.caret,.flash { display: none; }
      .mat { animation: none; opacity: 1; }
    }
  </style>
  <rect width="200" height="200" rx="26" fill="#08090c"/>
  <rect width="200" height="200" rx="26" fill="url(#sg-scan)"/>
  <rect x="14" y="14" width="172" height="172" rx="12" fill="none" stroke="#45c99e" stroke-width="3.5" filter="url(#sg-tglow)" opacity="0.6"/>
  <text class="ch0" x="30" y="110" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#45c99e">></text>
  <text class="ch1" x="52" y="110" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#35925c">s</text>
  <text class="ch2" x="68" y="110" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#e8689e">u</text>
  <text class="ch3" x="84" y="110" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#4aade0">c</text>
  <text class="ch4" x="100" y="110" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="bold" fill="#3ad4c6">h</text>
  <rect class="caret" x="52" y="90" width="13" height="22" rx="2" fill="#e8689e"/>
  <path class="mat mat-s" d="M 78,36 H 36 V 58 H 78 V 82 H 36" fill="none" stroke="#35925c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#sg-tglow)" transform="translate(3,0)"/>
  <path class="mat mat-u" d="m 118,36 v 34 c 0,12.15 9.85,13 22,13 12.15,0 22,-3.1 22,-13 V 36" fill="none" stroke="#e8689e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#sg-tglow)" transform="translate(-3,0)"/>
  <path class="mat mat-c" d="M 78,118 H 36 V 164 H 78" fill="none" stroke="#4aade0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#sg-tglow)" transform="translate(3,0)"/>
  <path class="mat mat-h" d="M 118,118 V 164 M 162,118 V 164 M 118,141 H 162" fill="none" stroke="#3ad4c6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#sg-tglow)" transform="translate(-3,0)"/>
  <rect class="flash" width="200" height="200" rx="26" fill="#45c99e"/>
</svg>
