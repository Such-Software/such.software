<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hash Bags app icon, drawn on.

  The # LEANS. It is a typographic monospace hash, which is how the mark renders everywhere
  on hash.boats (hero and every feature card) and how hash.boats/splash.svg draws it by hand:
  "verticals lean right". Do not straighten it.

  The wallet repo disagrees with itself here and its upright version is the outlier. Its
  hash_wallet_app_icon_source.svg rebuilt the glyph as paths to remove a font dependency and
  flattened the lean while doing so, and store/play-icon-512.png is upright too (verticals
  measured at x=206 and x=306 on every row). The brand's own site is the authority on the
  mark, so this follows hash.boats.

  Geometry is splash.svg's glyph mapped onto a full-bleed 1024 canvas, preserving its
  glyph-to-tile proportion exactly: the glyph spans 57.5% of the tile and the stroke is 8.75%
  of it. Full-bleed, NOT splash.svg's inset rounded box, because the site rounds icons with a
  22% CSS radius and an asset carrying its own transparent margin would show card background
  at the corners.

  CSS rather than SMIL, for the reason the brand pack documents: prefers-reduced-motion is a
  media query and cannot reach inside a SMIL <animate>. Draws once and holds; a looping icon
  on a directory page is a distraction and an app icon's resting state should be an app icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Hash Bags</title>
  <style>
    /* Every bar is the same length, so one dash length covers all four. The verticals run
       585 units (102.4 across, 576 down) and the bars across run 588.8; 600 over-covers
       both, which is what stroke-dashoffset needs to hide them fully. */
    .bar {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: hb-draw 520ms cubic-bezier(0.33, 0, 0.2, 1) forwards;
    }
    @keyframes hb-draw { to { stroke-dashoffset: 0; } }
    .v1 { animation-delay: 0ms; }
    .v2 { animation-delay: 110ms; }
    .h1 { animation-delay: 220ms; }
    .h2 { animation-delay: 330ms; }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; stroke-dashoffset: 0; }
    }
  </style>
  <rect width="1024" height="1024" fill="#1a5c38"/>
  <g stroke="#ffffff" stroke-width="89.6" stroke-linecap="butt" fill="none">
    <line class="bar v1" x1="460.8" y1="224" x2="358.4" y2="800"/>
    <line class="bar v2" x1="665.6" y1="224" x2="563.2" y2="800"/>
    <line class="bar h1" x1="217.6" y1="396.8" x2="806.4" y2="396.8"/>
    <line class="bar h2" x1="217.6" y1="627.2" x2="806.4" y2="627.2"/>
  </g>
</svg>
